name: Attendance email (manual)

# Nothing here runs on a schedule. The attendance email is sent by the admin pressing "Send report now" in the app.
# This workflow sends the same email from GitHub when someone runs it by hand: Actions -> this workflow -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if a report already went out today"
        type: boolean
        default: false

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Send report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_SENDER: ${{ secrets.REPORT_SENDER }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/daily_report.py
